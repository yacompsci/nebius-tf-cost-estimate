[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-tf-cost"
dynamic = ["version"]
description = "Estimate Nebius AI Cloud costs from Terraform plan/state JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nebius TF Cost Estimate" }]
keywords = ["nebius", "terraform", "cost", "estimate", "finops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/yacompsci/nebius-tf-cost-estimate"
Repository = "https://github.com/yacompsci/nebius-tf-cost-estimate"
Issues = "https://github.com/yacompsci/nebius-tf-cost-estimate/issues"
Changelog = "https://github.com/yacompsci/nebius-tf-cost-estimate/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
nebius-tf-cost = "nebius_tf_cost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nebius_tf_cost.__version__" }

[tool.setuptools.package-data]
nebius_tf_cost = ["py.typed", "data/prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default suite stays offline/fast; run e2e with: pytest -m e2e -o addopts=-q
addopts = ["-q", "-m not e2e"]
markers = [
  "e2e: plan-only Terraform end-to-end (requires terraform CLI; no cloud credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
