name: Bug report
description: Report incorrect estimates, crashes, or tooling bugs
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. This tool uses a vendored public catalog and needs **no cloud credentials**.
        Pricing *policy* questions often belong in discussions or docs issues; security issues → [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, minimal plan/state JSON (redacted), usage file, flags.
      placeholder: |
        nebius-tf-cost estimate --plan ... --json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version or git SHA.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Terraform version (if relevant).
