name: Publish to PyPI

# Publishes package `nebius-tf-cost` via Trusted Publishing (OIDC).
# Triggered after `.github/workflows/release.yml` creates a GitHub Release from a v* tag.
# Requires a PyPI Trusted Publisher + GitHub Environment named `pypi` (see CONTRIBUTING.md).
# No PYPI_API_TOKEN secret — do not add long-lived tokens.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches __version__
        env:
          PYTHONPATH: src
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(python -c 'from nebius_tf_cost import __version__; print(__version__)')"
          echo "tag=$TAG expected=$EXPECTED actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nebius-tf-cost
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
