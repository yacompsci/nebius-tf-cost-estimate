name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Pytest (unit; excludes e2e)
        run: python -m pytest

  e2e-terraform:
    name: E2E Terraform plan
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('tests/e2e/terraform/.terraform.lock.hcl', 'tests/e2e/terraform/versions.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Pytest e2e (plan-only; no apply; no secrets)
        run: python -m pytest -m e2e -o addopts=-q
